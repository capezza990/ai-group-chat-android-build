name: Build AI Group Chat APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          rm -rf build-source
          mkdir build-source
          unzip -q AI_GROUP_CHAT_B1B_SOURCE.zip -d build-source
          test -f build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate project
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB
        run: python3 tools/validate_project.py

      - name: Build APK
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage APK
        run: |
          cp build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB/app/build/outputs/apk/debug/app-debug.apk AI_GROUP_CHAT_ANDROID_M1-debug.apk
          test -s AI_GROUP_CHAT_ANDROID_M1-debug.apk
          ls -lh AI_GROUP_CHAT_ANDROID_M1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI_GROUP_CHAT_ANDROID_M1-debug-apk
          path: AI_GROUP_CHAT_ANDROID_M1-debug.apk
          if-no-files-found: error
          retention-days: 30
