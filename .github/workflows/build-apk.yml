name: Build AI Group Chat APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          rm -rf build-source
          mkdir build-source
          unzip -q AI_GROUP_CHAT_B3_FINAL_SOURCE.zip -d build-source
          test -f build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB/settings.gradle

      - name: Apply consolidated B3.3 correction
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB
        run: cat ../../B3_3_PATCH.b64.* | base64 -d | gzip -dc | patch -p1 --batch --forward

      - name: Apply B3.3 post-validation correction
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB
        run: patch -p1 --batch --forward < ../../B3_3_POST_VALIDATION_FIX.patch

      - name: Apply B3.4 file-sharing correction
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB
        run: cat ../../B3_4_FILEFIX.b64.* | base64 -d | gzip -dc | patch -p1 --batch --forward

      - name: Apply B3.4.1 chooser correction
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB
        run: patch -p1 --batch --forward < ../../B3_4_1_FILEFIX.patch

      - name: Apply B3.4.2 video-evidence correction
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB
        run: patch -p1 --batch --forward < ../../B3_4_2_VIDEO_CORRECTION.patch

      - name: Apply B3.4.3 manual chooser and DataTransfer correction
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB
        run: cat ../../B3_4_3_DATATRANSFER_FILEFIX.patch.gz.b64 | base64 -d | gzip -dc | patch -p1 --batch --forward

      - name: Apply B3.4.4 stability correction
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB
        run: cat ../../B3_4_4_STABILITY.patch.gz.b64 | base64 -d | gzip -dc | patch -p1 --batch --forward

      - name: Apply B3.4.4 UI safety test correction
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB
        run: patch -p1 --batch --forward < ../../B3_4_4_TESTFIX.patch

      - name: Apply B3.4.4 Send Stop test correction
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB
        run: patch -p1 --batch --forward < ../../B3_4_4_TESTFIX2.patch

      - name: Apply B3.4.4.1 diagnostic correction
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB
        run: cat ../../B3_4_4_1_DIAGNOSTIC.patch.gz.b64 | base64 -d | gzip -dc | patch -p1 --batch --forward

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate project and B3.3 rules
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB
        run: |
          python3 tools/validate_project.py
          python3 tools/roomtest/b33_consolidated_source_check.py
          python3 tools/roomtest/upload_source_check.py
          python3 tools/roomtest/capture_source_check.py
          python3 tools/roomtest/capture_source_check.py --selftest
          python3 tools/roomtest/file_ui_source_check.py
          python3 tools/roomtest/file_ui_source_check.py --selftest
          python3 tools/roomtest/wiring_source_check.py
          python3 tools/roomtest/wiring_source_check.py --selftest
          python3 tools/roomtest/ui_source_check.py
          python3 tools/roomtest/ui_source_check.py --selftest

      - name: Run room and artifact tests
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB
        env:
          ANDROID_JAR: /usr/local/lib/android/sdk/platforms/android-36/android.jar
        run: bash tools/roomtest/run_tests.sh

      - name: Run provider page tests
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB/tools/pagetest
        run: |
          npm install --no-audit --no-fund
          npm test
          python3 page_mutations.py

      - name: Package patched source snapshot
        run: |
          cd build-source
          zip -qr ../AI_GROUP_CHAT_PATCHED_SOURCE.zip AI_GROUP_CHAT_ANDROID_M1_GITHUB
          test -s ../AI_GROUP_CHAT_PATCHED_SOURCE.zip

      - name: Upload patched source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: AI_GROUP_CHAT_PATCHED_SOURCE
          path: AI_GROUP_CHAT_PATCHED_SOURCE.zip
          if-no-files-found: error
          retention-days: 7

      - name: Build APK
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage APK
        run: |
          cp build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB/app/build/outputs/apk/debug/app-debug.apk AI_GROUP_CHAT_ANDROID_M1-debug.apk
          test -s AI_GROUP_CHAT_ANDROID_M1-debug.apk
          sha256sum AI_GROUP_CHAT_ANDROID_M1-debug.apk
          ls -lh AI_GROUP_CHAT_ANDROID_M1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI_GROUP_CHAT_ANDROID_M1-debug-apk
          path: AI_GROUP_CHAT_ANDROID_M1-debug.apk
          if-no-files-found: error
          retention-days: 30
