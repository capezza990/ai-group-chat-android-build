name: Build AI Group Chat APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          rm -rf build-source
          mkdir build-source
          unzip -q AI_GROUP_CHAT_ANDROID_SOURCE.zip -d build-source
          test -f build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate project
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB
        run: python3 tools/validate_project.py

      - name: Build debug APK
        working-directory: build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK artifact
        run: |
          cp build-source/AI_GROUP_CHAT_ANDROID_M1_GITHUB/app/build/outputs/apk/debug/app-debug.apk AI_GROUP_CHAT_ANDROID_M1-debug.apk
          test -f AI_GROUP_CHAT_ANDROID_M1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI_GROUP_CHAT_ANDROID_M1-debug-apk
          path: AI_GROUP_CHAT_ANDROID_M1-debug.apk
          if-no-files-found: error
          retention-days: 30
